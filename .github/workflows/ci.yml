name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pre-commit in container
        run: |
          DOCKERFILE=./docker/Dockerfile_precommit \
          ./docker-exec.sh pre-commit run -a

  tests:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests in container
        run: ./docker-exec.sh "cd ha-wb-fast-modbus-mqtt && pytest -q"
