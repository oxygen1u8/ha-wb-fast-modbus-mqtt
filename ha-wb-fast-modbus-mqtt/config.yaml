name: "Wirenboard Fast Modbus to MQTT"
description: "Hi, Mark!"
version: "0.343"
slug: "ha-wb-fast-modbus-mqtt"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
uart: true
ports:
  7373/tcp: 7373
webui: http://[HOST]:[PORT:7373]
options:
  Serial port config:
    - Port: ""
  # MQTT data:
  #   Host: "core-mosquitto"
  #   Port: 1883
  #   Username: ""
  #   Password: ""
schema:
  Serial port config:
    - Port: device(subsystem=tty)
  # MQTT data:
  #   Host: str
  #   Port: port
  #   Username: str
  #   Password: str
